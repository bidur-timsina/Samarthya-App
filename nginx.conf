# ── Shubha Yatra Academy — Nginx Config ───────────────────────────────────────
# Place this at: /etc/nginx/sites-available/shubhayatra
# Then: sudo ln -s /etc/nginx/sites-available/shubhayatra /etc/nginx/sites-enabled/
# Then: sudo certbot --nginx -d shubhayatra.edu.np -d api.shubhayatra.edu.np

# ── API (NestJS backend on port 4000) ────────────────────────────────────────
server {
    listen 80;
    server_name api.shubhayatra.edu.np;

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';   # WebSocket support
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100M;               # allow large video uploads
    }
}

# ── MinIO file storage ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name files.shubhayatra.edu.np;

    location / {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
    }
}
